<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#111936"/>
      <stop offset="1" stop-color="#24124b"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52e5ff"/>
      <stop offset="0.52" stop-color="#8d7cff"/>
      <stop offset="1" stop-color="#ff69c9"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172443" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#0d1730" stop-opacity="0.94"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#826cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#826cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
