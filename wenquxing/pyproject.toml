[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wenquxing-v02"
version = "0.3.0"
description = "Feishu to GitHub Copilot CLI session bridge"
requires-python = ">=3.12"
dependencies = [
    "lark-oapi>=1.5.3,<2",
    "python-dotenv>=1.0,<2",
    "imageio-ffmpeg>=0.6,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
wenquxing-v02 = "wenquxing_v2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
